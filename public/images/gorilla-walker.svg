<svg width="320" height="283" viewBox="0 0 275 243" fill="none" xmlns="http://www.w3.org/2000/svg">
                <style>
        /* Ensure crisp pixel rendering */
        svg {
            shape-rendering: crispEdges;
        }

        /* Stepped pixel-grid walking cycle: back legs and front arm alternate in a natural knuckle-walk gait */
        @keyframes walkBackLegs {
            0%, 100% { transform: translate(0px, 0px); }
            25% { transform: translate(15.3px, -15.3px); }
            50% { transform: translate(30.6px, 0px); }
            75% { transform: translate(15.3px, 0px); }
        }

        @keyframes walkFrontArm {
            0%, 100% { transform: translate(0px, 0px); }
            25% { transform: translate(-15.3px, 0px); }
            50% { transform: translate(-30.6px, 0px); }
            75% { transform: translate(-15.3px, -15.3px); }
        }

        .walk-leg-left {
            animation: walkBackLegs 0.6s steps(1, end) infinite;
        }

        .walk-leg-right {
            animation: walkFrontArm 0.6s steps(1, end) infinite;
        }
    
@media (prefers-reduced-motion: reduce) { .walk-leg-left, .walk-leg-right { animation: none; } }
</style>
<defs>
                    <clipPath id="clip-gorilla">
                        <rect width="275" height="243" fill="white"/>
                    </clipPath>

                    <!-- Clip region for the stationary upper body -->
                    <clipPath id="clip-body">
                        <rect x="-50" y="-50" width="375" height="216.7"/>
                    </clipPath>

                    <!-- Strict lower-limb mask so lifting legs don't double-render the torso -->
                    <clipPath id="clip-lower-only">
                        <rect x="-50" y="166.7" width="375" height="126.3"/>
                    </clipPath>

                    <!-- Clip region for the rear/mid legs (x = 0 to 182.8) -->
                    <clipPath id="clip-back-legs">
                        <rect x="-50" y="150" width="232.8" height="143"/>
                    </clipPath>

                    <!-- Clip region for the front knuckle arm (x = 182.8 to 275) -->
                    <clipPath id="clip-front-arm">
                        <rect x="182.8" y="150" width="142.2" height="143"/>
                    </clipPath>

                    <!-- Reusable exact gorilla path -->
                    <g id="gorilla-shape">
                        <path d="M205.004 63.3047V63.7061L205.225 63.72L205.004 63.3047Z" fill="#000000"/>
