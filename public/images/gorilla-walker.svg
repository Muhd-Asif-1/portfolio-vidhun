8 212.172V197.54H153.116V166.697H182.812V182.118H197.583V197.332H212.521V212.255H225.673V216.172C225.645 223.994 225.728 231.829 225.521 239.664C225.451 242.349 226.365 242.986 228.926 242.958C240.708 242.848 252.517 242.917 264.312 242.917H274.75C274.861 241.796 275 241.117 275 240.453C274.958 221.322 274.903 202.191 274.917 183.06ZM251.465 58.8051L262.928 59.3311L262.471 69.1873L251.008 68.6613L251.465 58.8051ZM205.225 63.7193H204.99L205.004 63.304L205.737 47.3431L225.507 48.2567L224.745 64.6191L205.225 63.7193Z" fill="#000000"/>
                    </g>
                </defs>

                <g clip-path="url(#clip-gorilla)">
                    <!-- Static Upper Body -->
                    <g clip-path="url(#clip-body)">
                        <use href="#gorilla-shape"/>
                    </g>

                    <!-- Back/Mid Legs Walking Cycle -->
                    <g clip-path="url(#clip-back-legs)">
                        <g class="walk-leg-left">
                            <use href="#gorilla-shape" clip-path="url(#clip-lower-only)"/>
                        </g>
                    </g>

                    <!-- Front Arm Knuckle-Walking Cycle (Alternates with back legs) -->
                    <g clip-path="url(#clip-front-arm)">
                        <g class="walk-leg-right">
                            <use href="#gorilla-shape" clip-path="url(#clip-lower-only)"/>
                        </g>
                    </g>
                </g>
            </svg>
